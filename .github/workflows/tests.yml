# 每次 push / PR 自动在 GitHub 服务器上跑测试（Ubuntu + 三个 Python 版本）。
# 本地看不到它的作用；推到 GitHub 后，在仓库的 Actions 标签页能看到结果。
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装（含开发依赖）
        run: python -m pip install -e ".[dev]"
      - name: 跑测试
        run: python -m pytest
