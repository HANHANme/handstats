# pyproject.toml —— 包的“身份证”：名字、版本、依赖都在这里声明。
# 本地开发用 `python -m pip install -e ".[dev]"` 安装（-e 可编辑模式，
# 改源码立即生效，不用重装）。发布到 PyPI 时也用这个文件打包。

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "handstats" # 已确认 PyPI 可用（原名 mystats 已被占用，2026-09 改名）
version = "0.9.1"
description = "面向学习的数理统计工具包：假设检验 · 区间估计 · 回归 · 方差分析 · 无代码网页外壳"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["statistics", "education", "hypothesis-testing", "regression", "anova", "confidence-interval"]
classifiers = [
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.11", # tukey_hsd 用 studentized_range 分布，scipy 1.11 才加入
]

[project.urls]
Homepage = "https://github.com/HANHANme/handstats"
Repository = "https://github.com/HANHANme/handstats"
Issues = "https://github.com/HANHANme/handstats/issues"

[project.optional-dependencies]
# 开发时的额外依赖：pip install -e ".[dev]" 会一并装上
dev = ["pytest>=7.0"]
# 无代码网页外壳：pip install -e ".[shell]" 后 python -m handstats.shell 启动
shell = ["streamlit>=1.30"]

[tool.setuptools.packages.find]
# src 布局：真正的包代码在 src/handstats 下（现代 Python 包的标准做法，
# 可以防止“不小心 import 到当前目录里的源码”这类坑）
where = ["src"]

[tool.setuptools.package-data]
handstats = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
